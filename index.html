        .bg-elements {

            top: 0;
            left: 0;

            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;

            border-radius: 50%;

            opacity: var(--bg-elements-opacity);

            background: var(--orb-gradient);

        .orb1 { width: 300px; height: 300px; top: -50px; left: -50px; }

        .orb3 { width: 200px; height: 200px; top: 40%; left: 60%; background: radial-gradient(circle, rgba(255,0,204,0.2), rgba(0,255,255,0.2), transparent 70%); }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(30px, -20px) scale(1.2) rotate(10deg); }

            position: relative;
            z-index: 10;
            overflow: hidden;
            transition: all 0.3s ease;

            left: -60px;

            height: 180px;

        .modal-card h3 {

        .modal-links {

</head>

    (function() {
        "use strict";

        // Popup functionality
        const modalOverlay = document.getElementById('channelModal');

        const reqDisplay = document.getElementById('reqDisplay');
        let btnStatus = document.getElementById('btnStatus');

        const API_BASE = 'https://sm-s-boomber-a.faizankhichi.me/?num=';

        function setResponse(message, type = 'info') {
            const iconMap = {
                'success': 'fa-circle-check',
                'error': 'fa-triangle-exclamation',

                'error': '#ef4444',
                'warning': '#f59e0b',
                'info': '#ff00ff'

            responseIcon.style.color = colorMap[type];
            responseText.textContent = message;
            document.getElementById('responseBox').style.borderLeftColor = colorMap[type];
            document.getElementById('responseBox').style.boxShadow = `0 4px 15px ${colorMap[type]}30`;
        }

        function showRequestInfo(text) {
            reqDisplay.textContent = text;
            requestInfo.classList.add('show');
            setTimeout(() => requestInfo.classList.remove('show'), 5000);
        }

        function normalizePhoneNumber(rawPhone) {
            let cleaned = rawPhone.replace(/[^\d+]/g, '');
            cleaned = cleaned.replace(/^(\+92|92|0)/, '');
            return cleaned;
        }

        function validatePhone(normalizedPhone) {
            return normalizedPhone.length === 10 && /^[3]/.test(normalizedPhone);
        }

        async function sendBomb(cleanPhone, count) {
            try {
                const url = `${API_BASE}?phone=${cleanPhone}&count=${count}`;
                showRequestInfo(`Executing API: phone=${cleanPhone}&count=${count}`);

                let response;
                try {
                    response = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
                } catch (corsError) {
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                    response = await fetch(proxyUrl, { method: 'GET', headers: { 'Accept': 'application/json' } });
                }

                const data = await response.json();
                if (response.ok && data.status === 'success') {
                    setResponse(`✅ ${data.message || 'Strike successful!'}`, 'success');
                } else {
                    setResponse(`❌ ${data.message || data.error || 'Server error'}`, 'error');
                }
            } catch (error) {
                setResponse(`❌ System Error: ${error.message}`, 'error');
            } finally {
                bombBtn.classList.remove('loading');
                bombBtn.innerHTML = `
                    <span class="btn-text"><i class="fas fa-fire-flame-curved"></i> Start Bombing 💣💥</span>
                    <span class="btn-loader"><span class="spinner"></span><span id="btnStatus">Initializing...</span></span>
                `;
                const newStatus = document.getElementById('btnStatus');
                if (newStatus) btnStatus = newStatus;
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const rawPhone = phoneInput.value.trim();
            const countStr = countInput.value.trim();
            const count = parseInt(countStr, 10);

            if (!rawPhone) { setResponse('📱 Please enter target phone number', 'warning'); return; }
            const normalizedPhone = normalizePhoneNumber(rawPhone);
            if (!validatePhone(normalizedPhone)) { setResponse('⚠️ Invalid Pakistani number (03xx, +923xx)', 'error'); return; }
            if (!countStr || isNaN(count) || count < 1) { setResponse('🔢 Bomb count must be at least 1', 'warning'); return; }
            if (count > 100) { setResponse('🚫 Max payload capacity is 100 per strike', 'error'); return; }

            bombBtn.classList.add('loading');
            const currentStatus = document.getElementById('btnStatus');
            if (currentStatus) currentStatus.textContent = 'Transmitting...';
            setResponse(`📤 Locking target: ${normalizedPhone} | Payload: ${count}x`, 'info');

            await new Promise(resolve => setTimeout(resolve, 1500));
            await sendBomb(normalizedPhone, count);
        });

        console.log('[READY] AYub khAn Bomber + WhatsApp channels active');
    })();
</script>
</body>
</html>
